name: Deploy public research notes to GitHub Pages

on:
  push:
    branches:
      - v5
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify private files are not tracked
        shell: bash
        run: |
          if [ -n "$(git ls-files private)" ]; then
            echo "::error::Tracked files were found under private/"
            git ls-files private
            exit 1
          fi

      - name: Reject private markers in public content
        shell: bash
        run: |
          if grep -RInE '^(visibility:[[:space:]]*private|publish:[[:space:]]*false)' content --include='*.md'; then
            echo "::error::Private frontmatter was found under content/"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: npm run install-plugins

      - name: Build public content only
        run: node quartz/bootstrap-cli.mjs build -d content

      - name: Scan generated site for private research pages
        shell: bash
        run: |
          if grep -RIlE \
            '本地研究工作|工作一：量子轨迹研究稳态拓扑与输运性质|工作二：SWSSB 与 ASPT 的竞争' \
            public \
            --include='*.html' \
            --include='*.json' \
            --include='*.xml' \
            --include='*.js'; then
            echo "::error::Private research titles were found in the public site"
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
